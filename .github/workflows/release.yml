name: release

# Publishes a GitHub release whenever the version in .claude-plugin/plugin.json changes on main.
# The release notes are that version's section of CHANGELOG.md. Bumping the version is the only step.
on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release the current version if it has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already released"; exit 0
          fi
          # notes: the CHANGELOG section for this version (up to the next "## " heading)
          python3 - "$version" > notes.md <<'EOF'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else f"See CHANGELOG.md for {v}."
          print(body + "\n\nInstall or update:\n```\n/plugin marketplace add khaihernlow/seawulf-claude-code\n/plugin install seawulf@seawulf-claude-code\n```")
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
