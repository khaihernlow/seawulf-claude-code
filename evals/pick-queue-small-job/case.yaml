schema_version: "1.1"
name: pick-queue-small-job
expected_outcome: |
  Chooses a shared queue (short-40core-shared or short-96core-shared, 4 h limit) rather than a whole-node queue, sets --mem explicitly (shared queues default to about 2.4 GB per core), asks for 4 CPUs and a time limit of at least 2 h and at most 4 h, and explains the choice briefly.
